name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python scripts/verify_repository_security.py
      - run: python -m pip_audit -r requirements.txt
        working-directory: backend
      - run: python -m compileall -q app alembic tests
        working-directory: backend
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters
      - run: python -m unittest discover -s tests -v
        working-directory: backend
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-only-secret-key-with-more-than-thirty-two-characters

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run audit:prod
        working-directory: frontend
      - run: npm run verify:no-rsc
        working-directory: frontend
      - run: npm run verify:utf8
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
