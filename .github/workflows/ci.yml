name: CI/CD — VANER ASSET

on:
  push:
    branches: [product/vaner-asset, main]
  pull_request:
    branches: [product/vaner-asset]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # FASE 1: Lint y validación de código
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff==0.12.12 mypy

      - name: Ruff lint
        run: cd backend && ruff check . --select E9,F63,F7,F82 --output-format=github

      - name: Ruff format check
        run: cd backend && ruff format --check alembic/versions/a71c9e420001_solicitudes_correctivas.py alembic/versions/b82d0f530001_reportes_publicados.py alembic/versions/c93e1a640001_catalogo_categorias_canonico.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npx eslint src/ --max-warnings=50

  # ─────────────────────────────────────────────
  # FASE 2: Tests backend
  # ─────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vaner_asset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/vaner_asset_test
          SECRET_KEY: ci-test-secret-key-for-testing-only
          CONFIG_ENCRYPTION_KEY: ci-test-encryption-key-for-testing-only
          APP_ENV: testing
        run: |
          cd backend
          python -m pytest tests/ -x -q --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ─────────────────────────────────────────────
  # FASE 3: Build frontend
  # ─────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: /api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ─────────────────────────────────────────────
  # FASE 4: Validación de migraciones
  # ─────────────────────────────────────────────
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vaner_asset_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/vaner_asset_test
          MIGRATION_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/vaner_asset_test
          SECRET_KEY: ci-test-secret-key
        run: |
          cd backend
          alembic upgrade head

      - name: Verify tables
        run: |
          PGPASSWORD=test_password psql -h localhost -U postgres -d vaner_asset_test -c "\dt" | grep -c "public" || true

  # ─────────────────────────────────────────────
  # FASE 5: Seguridad — escaneo de secretos
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Check for dangerous patterns
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -rn "password.*=.*['\"]" --include="*.py" backend/app/ | grep -v "password_hash" | grep -v "password_field" | grep -v "verify_password" | grep -v "hash_password" | grep -v "password_policy" || true
          echo "Checking for debug mode in production..."
          ! grep -rn "DEBUG.*True" --include="*.py" backend/app/config.py || true
