name: Release VANER ASSET immutable images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
        env:
          APP_ENV: test
          DEBUG: "false"
          DATABASE_URL: sqlite:///./release-ci.db
          SECRET_KEY: release-ci-secret-key-with-more-than-thirty-two-characters
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run audit:prod
        working-directory: frontend
      - run: npm run verify:no-rsc
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: vanstralhen/vaner-asset-backend:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: vanstralhen/vaner-asset-frontend:${{ github.sha }}
          build-args: VITE_API_URL=/api
          provenance: mode=max
          sbom: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vanstralhen/vaner-asset-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vanstralhen/vaner-asset-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
