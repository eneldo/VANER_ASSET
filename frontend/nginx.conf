server {

    listen 8080;
    server_name _;

    server_tokens off;

    # VANER ASSET permite archivos de hasta 20 MB.
    # Dejamos margen adicional en el proxy.
    client_max_body_size 25m;

    # =====================================================
    # SECURITY HEADERS
    # =====================================================

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;

    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # API FASTAPI
    # =====================================================

    location /api/ {

        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =====================================================
    # STATIC ASSETS
    # =====================================================

    location /assets/ {

        try_files $uri =404;

        expires 30d;

        add_header Cache-Control "public, immutable";
    }

    # =====================================================
    # SERVICE WORKER
    # =====================================================

    location = /sw.js {

        try_files $uri =404;

        expires -1;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =====================================================
    # REACT SPA
    # =====================================================

    location / {

        try_files $uri $uri/ /index.html;

        expires -1;

        add_header Cache-Control "no-cache";
    }
}