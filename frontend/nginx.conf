server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # REACT ROUTER
    # =====================================================

    location / {
        try_files $uri /index.html;
    }

    # =====================================================
    # CACHE ESTÁTICOS
    # =====================================================

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}