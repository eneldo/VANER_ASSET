version: "3.9"

services:

  # =====================================================
  # POSTGRESQL
  # =====================================================

  postgres:
    image: postgres:16
    container_name: sga_postgres
    restart: always

    environment:
      POSTGRES_DB: sga_db
      POSTGRES_USER: sga_user
      POSTGRES_PASSWORD: sga_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  # =====================================================
  # BACKEND FASTAPI
  # =====================================================

  backend:
    build:
      context: ./backend

    container_name: sga_backend

    restart: always

    env_file:
      - .env.production

    depends_on:
      - postgres

    volumes:
      - ./backend/app/uploads:/app/app/uploads

    ports:
      - "8000:8000"

  # =====================================================
  # FRONTEND REACT
  # =====================================================

  frontend:
    build:
      context: ./frontend

    container_name: sga_frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3001:80"

volumes:
  postgres_data: