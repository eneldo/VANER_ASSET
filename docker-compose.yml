services:
  postgres:
    image: postgres:16
    container_name: sga_postgres
    restart: always
    environment:
      POSTGRES_DB: sga_db
      POSTGRES_USER: sga_user
      POSTGRES_PASSWORD: sga_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: sga_backend
    restart: always
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      UPLOAD_DIR: /app/uploads
    depends_on:
      - postgres
    volumes:
      - ./backend/app/uploads:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: sga_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  postgres_data: