services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    container_name: vaner_asset_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatoria}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD es obligatoria}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    networks:
      - vaner_asset_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.2-alpine}
    container_name: vaner_asset_redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - vaner_asset_internal

  migrate:
    build:
      context: ./backend
    restart: "no"
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      APP_ENV: migration
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL es obligatoria}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vaner_asset_internal

  backend:
    build:
      context: ./backend
    container_name: vaner_asset_backend
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-VANER ASSET}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY es obligatoria}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria}@redis:6379/0
      RATE_LIMIT_REDIS_REQUIRED: "true"
      BACKUP_ENCRYPTION_REQUIRED: "true"
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-vaner_asset_refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS es obligatoria}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es obligatoria}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      RUN_MIGRATIONS: "false"
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
      ALLOW_DATABASE_RESTORE: ${ALLOW_DATABASE_RESTORE:-false}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      MAX_INVENTORY_IMPORT_MB: ${MAX_INVENTORY_IMPORT_MB:-10}
      MAX_INVENTORY_IMPORT_ROWS: ${MAX_INVENTORY_IMPORT_ROWS:-10000}
      S3_BACKUP_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_BACKUP_ENDPOINT_URL: ${S3_BACKUP_ENDPOINT_URL:-}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-auto}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-vaner-asset-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/exports:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vaner_asset_internal
      - caddy_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: vaner_asset_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - vaner_asset_internal
      - caddy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backups_data:

networks:
  vaner_asset_internal:
    driver: bridge

  caddy_net:
    name: caddy_net
    external: true
