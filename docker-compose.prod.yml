# ============================================================
# SGA SaaS - docker-compose.prod.yml
# Usa imágenes pre-built de Docker Hub (no compila en el VPS)
# ============================================================

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    container_name: sga_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatoria}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD es obligatoria}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    networks:
      - sga_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5

  migrate:
    image: vanstralhen/sga-backend:${IMAGE_TAG:?IMAGE_TAG es obligatoria}
    pull_policy: always
    restart: "no"
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      APP_ENV: migration
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL es obligatoria}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sga_internal

  backend:
    image: vanstralhen/sga-backend:${IMAGE_TAG:?IMAGE_TAG es obligatoria}
    container_name: sga_backend
    pull_policy: always
    restart: always
    environment:
      APP_NAME: ${APP_NAME:-SGAHolding}
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatoria}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL es obligatoria}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY es obligatoria}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-sga_refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS es obligatoria}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL es obligatoria}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      RUN_MIGRATIONS: "false"
      RUN_SCHEDULER: ${RUN_SCHEDULER:-true}
      ALLOW_DATABASE_RESTORE: ${ALLOW_DATABASE_RESTORE:-false}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      S3_BACKUP_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_BACKUP_ENDPOINT_URL: ${S3_BACKUP_ENDPOINT_URL:-}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-auto}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_BACKUP_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-sga-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sga_internal
      - caddy_net

  frontend:
    image: vanstralhen/sga-frontend:${IMAGE_TAG:?IMAGE_TAG es obligatoria}
    container_name: sga_frontend
    pull_policy: always
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sga_internal
      - caddy_net

volumes:
  postgres_data:
  uploads_data:
  backups_data:

networks:
  sga_internal:
    driver: bridge

  caddy_net:
    name: caddy_net
    external: true
