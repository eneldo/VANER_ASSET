# VANER ASSET - Configuración por defecto (sistema)
# Archivo: config/default/app.conf
# Never modify these values for core system operation

[general]
app_name = VANER Asset
app_version = 2.0.0
app_env = development
debug = true

[database]
dialect = postgresql
host = localhost
port = 5432
database = vaner_asset_default
migrations_database = vaner_asset_migrations
backup_database = vaner_asset_backups

[server]
host = 127.0.0.1
port = 8000
frontend_url = http://localhost:5173

[security]
secret_key = CHANGE_ME_development_only_minimum_32_chars
algorithm = HS256
access_token_expire_minutes = 30
refresh_token_expire_days = 7

[cors]
origins = http://localhost:5173

[features]
scheduler_enabled = false
rate_limit_redis_required = false
backup_encryption_required = false
s3_backup_enabled = false

[i18n]
locale = es-CO
timezone = America/Bogota

[branding]
default_theme = branding/default
show_vaner_brand = true