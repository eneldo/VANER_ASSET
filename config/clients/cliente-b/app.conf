# VANER ASSET - Configuración Cliente B
# Archivo: config/clients/cliente-b/app.conf
# Configuración personalizada para Cliente B

[general]
app_name = VANER Asset
app_version = 2.0.0
app_env = development
debug = true
client_code = cliente-b
client_name = Cliente B S.A.S.

[database]
dialect = postgresql
host = localhost
port = 5432
database = vaner_asset_cliente_b
migrations_database = vaner_asset_migrations
backup_database = vaner_asset_backups

[server]
host = 127.0.0.1
port = 8000
frontend_url = http://asset.cliente-b.com

[security]
secret_key = CHANGE_ME_cliente_b_development_only_minimum_32_chars
algorithm = HS256
access_token_expire_minutes = 30
refresh_token_expire_days = 7

[cors]
origins = [http://localhost:5173, http://asset.cliente-b.com]

[features]
scheduler_enabled = false
rate_limit_redis_required = false
backup_encryption_required = false
s3_backup_enabled = false
modules = [assets, inventory, maintenance, work_orders, suppliers]

[i18n]
locale = es-CO
timezone = America/Bogota

[branding]
default_theme = branding/clients/cliente-b
show_vaner_brand = true

[client_specific]
company_nit = 900987654-3
company_address = Calle 13 # 45-12, Medellin, Colombia
company_phone = +57 4 456 7890
company_email = contacto@cliente-b.com
company_logo = branding/clients/cliente-b/logo.svg