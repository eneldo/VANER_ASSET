# VANER ASSET - Configuración Cliente A
# Archivo: config/clients/cliente-a/app.conf
# Configuración personalizada para Cliente A

[general]
app_name = VANER Asset
app_version = 2.0.0
app_env = development
debug = true
client_code = cliente-a
client_name = Cliente A S.A.S.

[database]
dialect = postgresql
host = localhost
port = 5432
database = vaner_asset_cliente_a
migrations_database = vaner_asset_migrations
backup_database = vaner_asset_backups

[server]
host = 127.0.0.1
port = 8000
frontend_url = http://asset.cliente-a.com

[security]
secret_key = CHANGE_ME_cliente_a_development_only_minimum_32_chars
algorithm = HS256
access_token_expire_minutes = 30
refresh_token_expire_days = 7

[cors]
origins = [http://localhost:5173, http://asset.cliente-a.com]

[features]
scheduler_enabled = false
rate_limit_redis_required = false
backup_encryption_required = false
s3_backup_enabled = false
modules = [assets, inventory, maintenance, work_orders]

[i18n]
locale = es-CO
timezone = America/Bogota

[branding]
default_theme = branding/clients/cliente-a
show_vaner_brand = true

[client_specific]
company_nit = 900123456-7
company_address = Cra 15 # 93-10, Bogota, Colombia
company_phone = +57 1 234 5678
company_email = contacto@cliente-a.com
company_logo = branding/clients/cliente-a/logo.svg